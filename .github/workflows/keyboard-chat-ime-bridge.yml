name: Build Zalith Keyboard IME Bridge (arm64 Release)

on:
  push:
    branches:
      - keyboard-chat-ime-bridge
    paths:
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/activities/VMActivity.kt'
      - '.github/workflows/keyboard-chat-ime-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile arm64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64 --no-daemon --stacktrace

      - name: Upload patched launcher APK
        uses: actions/upload-artifact@v7
        with:
          name: zalith-keyboard-ime-bridge-arm64
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
