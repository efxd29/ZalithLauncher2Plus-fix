name: Build arm64 APK
on:
  workflow_dispatch:
  push:
    branches: [fix]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace > build.log 2>&1 || { echo "=== ERRORS ==="; grep -nE "^e: |error:|What went wrong|Execution failed|Unresolved|FAILED" -A3 build.log | cut -c1-300 | head -90; tail -n 400 build.log > build.tail; mv build.tail build.log; exit 1; }
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            build.log
            ZalithLauncher/build/outputs/apk/**/*.apk
