name: Release

on:
  workflow_dispatch:
  # One-time build trigger for this fix branch. It is removed after the release is built.
  push:
    branches:
      - release-26.3-arm64
    paths:
      - '.github/workflows/last.yml'

permissions:
  contents: write

jobs:
  Build:
    if: ${{ !contains(github.event.head_commit.message, 'ci: disable auto build') }}
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets: inherit

  Release:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: ./release-artifacts/*.apk
          
