name: Release

on:
  workflow_dispatch:
  # One-time build trigger for this fix branch. It is removed after the release is built.
  push:
    branches:
      - release-26.3-arm64
    paths:
      - '.github/workflows/last.yml'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/game/version/installed/PlayTimeRepository.kt'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/activities/VMActivity.kt'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/GameStatsScreen.kt'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/LauncherScreen.kt'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/PlayTimeStatsScreen.kt'
      - 'ZalithLauncher/src/main/java/com/movtery/zalithlauncher/utils/PlayTimeUtils.kt'
      - 'ZalithLauncher/src/main/java/org/libsdl/app/SDLActivity.java'
      - 'ZalithLauncher/src/main/java/org/libsdl/app/SDLInputConnection.java'
      - 'ZalithLauncher/src/main/java/org/libsdl/app/SdlImeController.java'

permissions:
  contents: write

jobs:
  Build:
    if: ${{ !contains(github.event.head_commit.message, 'ci: disable auto build') }}
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets: inherit

  Release:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Release Build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: ./release-artifacts/*.apk
          
